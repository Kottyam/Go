plugins {
    id "com.android.application"
}

def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin" && details.requested.name.startsWith("kotlin-stdlib")) {
            details.useVersion "1.9.25"
        }
    }
}

android {
    namespace "com.alien1729.goservice"
    compileSdk 35

    defaultConfig {
        applicationId "com.alien1729.goservice"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            } else {
                // Keep the existing release signing key for local/CI continuity.
                // GitHub Secrets can override this when configured.
                storeFile file("go-upload.jks")
                storePassword "go1729upload"
                keyAlias "upload"
                keyPassword "go1729upload"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.activity:activity:1.9.3"
    implementation "com.google.android.gms:play-services-auth:21.3.0"
}
